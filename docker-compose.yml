version: "3.8"

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: remotelyx-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: remotelyx_jobs
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - remotelyx-network

  # RemotelyX API Server
  api:
    build: .
    container_name: remotelyx-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/remotelyx_jobs?authSource=admin
      - MONGODB_DATABASE=remotelyx_jobs
      - MONGODB_COLLECTION=job_postings
      - DEBUG=false
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      - mongodb
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - remotelyx-network
    command: ["/app/start.sh", "api"]

  # RemotelyX Dashboard
  dashboard:
    build: .
    container_name: remotelyx-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/remotelyx_jobs?authSource=admin
      - MONGODB_DATABASE=remotelyx_jobs
      - MONGODB_COLLECTION=job_postings
      - API_BASE_URL=http://api:8000
      - DEBUG=false
      - LOG_LEVEL=INFO
    depends_on:
      - mongodb
      - api
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - remotelyx-network
    command: ["/app/start.sh", "dashboard"]

  # n8n Automation Platform
  n8n:
    image: n8nio/n8n:latest
    container_name: remotelyx-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_HOST=localhost
      - GENERIC_TIMEZONE=UTC
      - TZ=UTC
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      # Persist credentials and workflows in the volume
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - mongodb
    networks:
      - remotelyx-network

volumes:
  mongodb_data:
    driver: local
  n8n_data:
    driver: local

networks:
  remotelyx-network:
    driver: bridge
